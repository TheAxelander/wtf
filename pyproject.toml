[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wtf"
dynamic = ["version"]
description = "Print some common notes in table format"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
    { name = "Alexander Preibisch", email = "git@axelander.dev" },
]
classifiers = [
  "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "python-dotenv>=1.1.0",
    "rich>=13.7.1"
]

[project.urls]
Documentation = "https://github.com/TheAxelander/wtf#readme"
Issues = "https://github.com/TheAxelander/wtf/issues"
Source = "https://github.com/TheAxelander/wtf"

[tool.hatch.version]
path = "src/wtf/__about__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src/wtf",
]

[project.scripts]
wtf = "wtf.main:main"
